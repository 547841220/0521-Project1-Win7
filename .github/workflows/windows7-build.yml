name: Build Win7 Compatible Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "installer/**"
      - "package/**"
      - "build-windows.bat"
      - "package-windows-installer.bat"
      - ".github/workflows/windows7-build.yml"

jobs:
  build-win7-installer:
    name: Build Win7 installer
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          architecture: x64

      - name: Compile Swing app
        run: |
          New-Item -ItemType Directory -Force -Path build, dist | Out-Null
          javac -encoding UTF-8 -source 1.8 -target 1.8 -d build src\com\aimoney\fieldledger\win7\*.java
          jar cfe dist\field-ledger-win7.jar com.aimoney.fieldledger.win7.FieldLedgerWin7App -C build .

      - name: Bundle Java runtime
        run: |
          if (Test-Path package\jre) {
            Remove-Item package\jre -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path package\jre | Out-Null
          Copy-Item -Path "$env:JAVA_HOME\*" -Destination package\jre -Recurse -Force
          if (!(Test-Path package\jre\bin\javaw.exe)) {
            throw "Bundled Java runtime is missing package\jre\bin\javaw.exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\FieldLedgerWin7.iss

      - name: Upload Win7 installer
        uses: actions/upload-artifact@v4
        with:
          name: windows7-compatible-installer
          path: package/output/*
          if-no-files-found: error
